[Application]
MemoryWorkingSetLimit=512

[BitTorrent]
Session\AddExtensionToIncompleteFiles=false
Session\AddTrackersEnabled=true
Session\AnnounceToAllTrackers=false
Session\AnonymousModeEnabled=false

# Default disk IO — mmap (type 4) was burning CPU for no extra MB/s
Session\AsyncIOThreadsCount=2
Session\ConnectionSpeed=50
Session\DiskCacheSize=64
Session\DiskIOType=0
Session\DiskIOReadMode=1
Session\DiskIOWriteMode=1

Session\GlobalDLSpeedLimit=0
Session\GlobalMaxRatio=0
Session\GlobalMaxSeedingMinutes=0
Session\GlobalUPSpeedLimit=256

# 1 hash thread serialized SHA-1 → 100% one core + slower DL
Session\HashingThreadsCount=2

Session\IgnoreSlowTorrentsForQueueing=true
Session\IncludeOverheadInLimits=false

Session\DHTEnabled=true
Session\LSDEnabled=false
Session\PexEnabled=true
Session\MultiConnectionsPerIp=true

Session\MaxActiveCheckingTorrents=1
Session\ReannounceWhenChecking=false

Session\MaxActiveDownloads=5
Session\MaxActiveTorrents=8
Session\MaxActiveUploads=2

Session\MaxConnections=200
Session\MaxConnectionsPerTorrent=80

Session\MaxUploads=8
Session\MaxUploadsPerTorrent=4

Session\MaxRatioAction=1
Session\MaxRatio=0
Session\GlobalMaxRatio=0
Session\GlobalMaxSeedingMinutes=0

Session\PerformanceWarning=false
Session\Preallocation=false
Session\QueueingSystemEnabled=true

Session\SlowTorrentsDownloadRate=2
Session\SlowTorrentsInactivityTimer=600
Session\SlowTorrentsUploadRate=2

Session\StopTrackerTimeout=5
Session\TrackerPortForwarding=false

TrackerEnabled=true

[LegalNotice]
Accepted=true

[Meta]
MigrationVersion=8

[Preferences]
Advanced\DisableRecursiveDownload=false
Advanced\RecheckOnCompletion=false
Advanced\trackerPortForwarding=false
Advanced\osCache=true

General\PreventFromSuspendWhenDownloading=true
General\PreventFromSuspendWhenSeeding=false

Search\SearchEnabled=false

WebUI\Address=*
WebUI\Enabled=true
WebUI\HTTPS\Enabled=false
WebUI\Port=8090
WebUI\LocalHostAuth=false
WebUI\MaxAuthenticationFailCount=10
WebUI\BanDuration=3600
WebUI\SessionTimeout=3600
WebUI\CSRFProtection=true
WebUI\ClickjackingProtection=true
WebUI\HostHeaderValidation=true
WebUI\SecureCookie=false
WebUI\Username=admin
