[Application]
MemoryWorkingSetLimit=384

[BitTorrent]
Session\AddExtensionToIncompleteFiles=false
Session\AddTrackersEnabled=true
Session\AnnounceToAllTrackers=true
Session\AnnounceToAllTiers=true
Session\AnonymousModeEnabled=false

# Default disk IO — 8 IO threads + 64MB cache for unthrottled throughput
Session\AsyncIOThreadsCount=8
Session\ConnectionSpeed=40
Session\DiskCacheSize=64
Session\DiskIOType=0
Session\DiskIOReadMode=1
Session\DiskIOWriteMode=1
Session\CoalesceReadsWrites=true

Session\GlobalDLSpeedLimit=0
Session\GlobalMaxRatio=0
Session\GlobalMaxSeedingMinutes=0
Session\GlobalUPSpeedLimit=0

# 2 hash threads for parallel SHA-1 piece checking
Session\HashingThreadsCount=2

Session\IgnoreSlowTorrentsForQueueing=true
Session\IncludeOverheadInLimits=false

Session\DHTEnabled=true
Session\LSDEnabled=true
Session\PexEnabled=true
Session\MultiConnectionsPerIp=true

Session\MaxActiveCheckingTorrents=1
Session\ReannounceWhenChecking=false

Session\MaxActiveDownloads=20
Session\MaxActiveTorrents=20
Session\MaxActiveUploads=3

Session\MaxConnections=500
Session\MaxConnectionsPerTorrent=200

Session\MaxUploads=20
Session\MaxUploadsPerTorrent=8

Session\MaxRatioAction=1
Session\MaxRatio=0
Session\GlobalMaxRatio=0
Session\GlobalMaxSeedingMinutes=0

Session\PerformanceWarning=false
Session\Preallocation=false
Session\QueueingSystemEnabled=false

Session\SlowTorrentsDownloadRate=100
Session\SlowTorrentsInactivityTimer=120
