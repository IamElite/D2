name: static-check

on:
  push:
    branches: [arnv1]
  pull_request:
    branches: [arnv1]
  workflow_dispatch:

jobs:
  pyflakes:
    name: pyflakes (crash-risk check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pyflakes
        run: python -m pip install --upgrade pip pyflakes

      - name: Run pyflakes
        run: |
          find bot -name "*.py" -print0 \
            | xargs -0 python -m pyflakes > pyflakes-report.txt 2>&1 || true
          echo "----- pyflakes report -----"
          cat pyflakes-report.txt
          echo "---------------------------"

      - name: Fail on undefined names / syntax errors
        run: |
          if grep -qE "undefined name|invalid syntax|SyntaxError" pyflakes-report.txt; then
            echo "::error::pyflakes found crash-risk issues:"
            grep -E "undefined name|invalid syntax|SyntaxError" pyflakes-report.txt
            exit 1
          fi
          echo "OK: no undefined names, no syntax errors."
