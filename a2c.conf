# ==========================================
# ARIA2 - HEROKU STANDARD-2X (1GB RAM)
# RAM-backed IO for speed, low idle CPU
# ==========================================

# CORE & RPC
daemon=true
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-max-request-size=32M

# LOGGING (quiet = less CPU)
quiet=true
console-log-level=warn
summary-interval=0
log-level=notice

# HTTP / HTTPS — max throughput: more connections/splits + small min-split so
# even small files use many sockets. CPU headroom is large (idle ~13%), so we
# trade a little connection-churn for big throughput. ARIA2_PROFILE=safe reverts.
max-concurrent-downloads=10
max-connection-per-server=16
split=16
min-split-size=4M
optimize-concurrent-downloads=true
# 260905-R: pipelining OFF. With pipelining, aria2 sends several pipelined Range
# requests on one connection. A server that mishandles Range answers with the
# WHOLE file, so aria2 aborts with `Invalid range header. Request: a-b/N,
# Response: 0-(N-1)/N` (exit 8) and the task dies. Verified against real aria2c
# 1.37.0: with prod split=16/conn=16 a Range-ignoring server FAILS at true and
# downloads correctly (sha256-verified) at false, while a Range-honouring server
# is unaffected either way. aria2's own default is false.
enable-http-pipelining=false
http-accept-gzip=true
reuse-uri=true
continue=true
always-resume=true
auto-file-renaming=true
allow-overwrite=true
force-save=false
content-disposition-default-utf8=true

# Retry
max-tries=8
max-file-not-found=2
retry-wait=4

# DISK / RAM — use RAM as cache, skip falloc (ephemeral FS, burns CPU)
file-allocation=none
disk-cache=32M
enable-mmap=false
check-integrity=false
realtime-chunk-checksum=false
save-session-interval=0

# NETWORK
connect-timeout=20
timeout=40
disable-ipv6=true
event-poll=epoll
socket-recv-buffer-size=1M
lowest-speed-limit=0

# TLS
check-certificate=true

# BITTORRENT — peer throughput (Heroku is OUTBOUND-leech only; inbound UDP is
# blocked, so peer count WE cap = the throughput ceiling). High peer ceiling +
# peer-speed-limit set as an AGGREGATE TARGET: aria2 keeps hunting peers until
# total speed crosses this, so 1K (=stop after 1KB/s) starved it to a few
# peers. DHT stays ON for discovery (UDP outbound works). DB-safe overlay in
# __init__.py enforces these even if Mongo restores old prefs.
enable-dht=true
enable-peer-exchange=true
bt-enable-lpd=false
bt-detach-seed-only=true
bt-remove-unselected-file=true
bt-max-peers=200
bt-max-open-files=200
bt-hash-check-seed=false
peer-id-prefix=-qB4430-
peer-agent=qBittorrent/4.4.3
seed-ratio=0.0
seed-time=0
follow-torrent=true
listen-port=6881-6889
dht-listen-port=6881-6889
max-overall-upload-limit=0
max-upload-limit=0

# USER AGENT
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36
