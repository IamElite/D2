
# Heroku Standard-2X Optimized Config
# 1GB RAM | Low CPU | Stable


# --- Core & RPC ---
daemon=false
enable-rpc=true
rpc-listen-all=true
rpc-max-request-size=1024M

# --- Stats ---
quiet=false
summary-interval=10

# --- CONCURRENT DOWNLOADS (RAM bachane ke liye LOW) ---
max-concurrent-downloads=3
max-connection-per-server=8
split=8
min-split-size=20M
optimize-concurrent-downloads=true

# --- Memory & Cache (CRITICAL for 1GB RAM) ---
disk-cache=32M
file-allocation=trunc
socket-recv-buffer-size=4M

# --- Stability ---
continue=true
auto-file-renaming=true
allow-overwrite=true
force-save=true
content-disposition-default-utf8=true
http-accept-gzip=true
max-tries=5
max-file-not-found=3
check-certificate=false
reuse-uri=true
check-integrity=false

# --- Network ---
connect-timeout=20
timeout=30
retry-wait=3
disable-ipv6=true

# --- BitTorrent (LIGHTWEIGHT) ---
bt-enable-lpd=false
bt-detach-seed-only=true
bt-remove-unselected-file=true
bt-max-peers=50
bt-max-open-files=100
bt-request-peer-speed-limit=512K
seed-ratio=0
seed-time=0
follow-torrent=mem
bt-stop-timeout=120

# --- Identity ---
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
peer-id-prefix=-qB5220-
peer-agent=qBittorrent/5.2.2

# --- Bandwidth ---
max-upload-limit=1K

# --- HEROKU SPECIFIC (NO SESSION SAVE - Ephemeral FS) ---
save-session=
save-session-interval=0
