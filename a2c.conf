# Optimized Aria2 Configuration (Max Speed)

# --- Core & RPC Setup ---
daemon=true
enable-rpc=true
rpc-listen-all=true
rpc-max-request-size=1024M

# --- Stats & Logging (Har 10 sec mein update) ---
quiet=false
summary-interval=10

# --- Download Optimization ---
max-concurrent-downloads=1000
max-connection-per-server=16
split=16
min-split-size=32M
optimize-concurrent-downloads=true
continue=true
auto-file-renaming=true
allow-overwrite=true
force-save=false
content-disposition-default-utf8=true
http-accept-gzip=true
max-tries=20
max-file-not-found=0
check-certificate=false
reuse-uri=true
file-allocation=falloc
disk-cache=128M
check-integrity=true
socket-recv-buffer-size=16M

# --- Network & Timeouts ---
connect-timeout=30
timeout=30
retry-wait=5
disable-ipv6=false

# --- BitTorrent Specific ---
bt-enable-lpd=true
bt-detach-seed-only=true
bt-remove-unselected-file=true
bt-max-peers=0
bt-max-open-files=1000
bt-request-peer-speed-limit=1M
seed-ratio=0
follow-torrent=mem
# Note: Trackers dynamic rakhne ke liye bash script behtar hai, 
# warna yaha comma-separated static trackers daal sakte ho.

# --- Identity (Anti-Block / Anti-Throttle) ---
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.0.0 Safari/537.36
peer-id-prefix=-qB5220-
peer-agent=qBittorrent/5.2.2

# --- Bandwidth Control ---
max-upload-limit=1K
