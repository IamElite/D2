# Heroku Standard-2X (1GB RAM) Perfect Config
# No Code Changes Required | Instant Filename | Stable

# Core Settings (Heroku Compatible)
daemon=false
enable-rpc=true
rpc-listen-port=6800
rpc-listen-all=true
rpc-max-request-size=1024M

# Instant Filename Detection & Speed
file-allocation=none
min-split-size=10M
split=8
max-connection-per-server=8
max-concurrent-downloads=2
optimize-concurrent-downloads=true

# Memory & Stability (1GB RAM Safe)
disk-cache=32M
socket-recv-buffer-size=4M

# Reliability
continue=true
auto-file-renaming=true
allow-overwrite=true
force-save=true
content-disposition-default-utf8=true
http-accept-gzip=true
max-tries=10
max-file-not-found=3
check-certificate=false
reuse-uri=true
check-integrity=false

# Network
connect-timeout=20
timeout=30
retry-wait=3
disable-ipv6=true

# BitTorrent (Lightweight for Low CPU)
bt-enable-lpd=true
bt-detach-seed-only=true
bt-remove-unselected-file=true
bt-max-peers=50
bt-max-open-files=100
bt-request-peer-speed-limit=512K
seed-ratio=0
seed-time=0
follow-torrent=mem
bt-stop-timeout=120

# Identity (Anti-Block)
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.0.0 Safari/537.36
peer-id-prefix=-qB5220-
peer-agent=qBittorrent/5.2.2

# Bandwidth Control
max-upload-limit=1K

# Heroku Ephemeral FS (No session save to prevent errors)
save-session=
save-session-interval=0
