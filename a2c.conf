# ==========================================
# ARIA2 - 1GB RAM / HEROKU SAFE MAX SPEED
# ==========================================

# --- RPC ---
daemon=true
enable-rpc=true
rpc-listen-all=true
rpc-max-request-size=512M

# --- Logging ---
quiet=true
summary-interval=15

# --- Download ---
max-concurrent-downloads=4
max-connection-per-server=12
split=12
min-split-size=16M
optimize-concurrent-downloads=true

continue=true
auto-file-renaming=true
allow-overwrite=true
force-save=false

content-disposition-default-utf8=true
http-accept-gzip=true

max-tries=10
max-file-not-found=3
retry-wait=3
reuse-uri=true

# --- Disk ---
file-allocation=falloc
disk-cache=32M
check-integrity=false

# --- Network ---
connect-timeout=15
timeout=30

socket-recv-buffer-size=4M
disable-ipv6=false

# --- BitTorrent ---
bt-enable-lpd=true
bt-detach-seed-only=true
bt-remove-unselected-file=true

bt-max-peers=50
bt-max-open-files=256
bt-request-peer-speed-limit=512K

seed-ratio=0
follow-torrent=mem

# --- Identity ---
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.0.0 Safari/537.36

# --- Upload ---
max-upload-limit=1M
