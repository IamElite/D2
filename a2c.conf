# ==========================================
# ARIA2 - HEROKU STANDARD-2X (1GB RAM)
# RAM-backed IO for speed, low idle CPU
# ==========================================

# CORE & RPC
daemon=true
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-max-request-size=32M

# LOGGING (quiet = less CPU)
quiet=true
console-log-level=warn
summary-interval=0
log-level=notice

# HTTP / HTTPS — fewer sockets, larger pieces = less CPU, same throughput
max-concurrent-downloads=5
max-connection-per-server=16
split=16
min-split-size=1M
optimize-concurrent-downloads=true
enable-http-pipelining=true
http-accept-gzip=true
reuse-uri=true
continue=true
always-resume=true
auto-file-renaming=true
allow-overwrite=true
force-save=false
content-disposition-default-utf8=true

# Retry
max-tries=8
max-file-not-found=2
retry-wait=4

# DISK / RAM — use RAM as cache, skip falloc (ephemeral FS, burns CPU)
file-allocation=falloc
disk-cache=32M
enable-mmap=false
check-integrity=false
realtime-chunk-checksum=false
save-session-interval=0

# NETWORK
connect-timeout=20
timeout=40
disable-ipv6=true
event-poll=epoll
socket-recv-buffer-size=2M
lowest-speed-limit=0

# TLS
check-certificate=true

# BITTORRENT — perf-tuned (peer-speed-limit 1K was THE speed-killer), DHT off (UDP-dead host)
enable-dht=false
enable-peer-exchange=false
bt-enable-lpd=false
bt-detach-seed-only=true
bt-remove-unselected-file=true
bt-max-peers=120
bt-max-open-files=80
bt-request-peer-speed-limit=15M
bt-hash-check-seed=false
seed-ratio=0.0
seed-time=0
follow-torrent=true
listen-port=6881-6889
dht-listen-port=6881-6889
max-overall-upload-limit=256K
max-upload-limit=128K

# USER AGENT
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36
