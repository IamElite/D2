# ==========================================
# ARIA2 - HEROKU STANDARD-2X / 1GB RAM
# HIGH SPEED + LOW RESOURCE + FAST FILENAME
# ==========================================


# CORE & RPC
daemon=true
enable-rpc=true
rpc-listen-all=true
rpc-max-request-size=512M

# LOGGING
quiet=true
summary-interval=15

# HTTP / HTTPS DOWNLOAD
max-concurrent-downloads=4
max-connection-per-server=12
split=12
min-split-size=16M
optimize-concurrent-downloads=true

continue=true
auto-file-renaming=true
allow-overwrite=true
force-save=false

# Fast filename detection
remote-header-name=true
content-disposition-default-utf8=true

# HTTP compression / URI handling
http-accept-gzip=true
reuse-uri=true

# Retry
max-tries=10
max-file-not-found=3
retry-wait=3

# DISK / RAM OPTIMIZATION
file-allocation=falloc
disk-cache=32M

# Disable extra checksum work for lower CPU usage
check-integrity=false

# NETWORK
connect-timeout=15
timeout=30
retry-wait=3
disable-ipv6=false

# Keep memory usage reasonable
socket-recv-buffer-size=4M

# TLS / HTTPS
check-certificate=true

# BITTORRENT
bt-enable-lpd=true
bt-detach-seed-only=true
bt-remove-unselected-file=true
bt-max-peers=50
bt-max-open-files=256
bt-request-peer-speed-limit=512K
seed-ratio=0
follow-torrent=mem

# USER AGENT
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36

# UPLOAD
max-upload-limit=1M
