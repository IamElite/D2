# ============================================================
#  D2 — VPS / koi bhi Docker host ke liye
#  Heroku pe iski zaroorat nahi (wahan platform PORT khud set karta hai).
#
#  ⚠️ HAMESHA --env-file config.env ke saath chalao:
#      docker compose --env-file config.env up -d --build
#
#     Yeh flag port-mapping interpolation ke liye zaroori hai. Bina iske
#     compose ko BASE_URL_PORT nahi pata chalega aur neeche `:?` wala guard
#     saaf error dekar ruk jaayega (chup-chaap galat port map nahi karega).
#
#  Pehli baar:
#      cp .env.example config.env     # phir values bharo (config.env gitignored hai)
#      docker compose --env-file config.env up -d --build
#
#  Logs:     docker compose logs -f
#  Update:   docker compose --env-file config.env up -d --build   (ya bot me /restart)
#  Band:     docker compose down
#
#  Web server ka port sirf BASE_URL_PORT se decide hota hai — alag se PORT
#  dene ki zaroorat nahi (bot/__init__.py: WEB_SERVER_PORT = PORT or BASE_URL_PORT).
#
#  ⚠️ Ek hi BOT_TOKEN ek hi jagah chalao. Heroku + VPS dono ek saath mat
#     chalana — same token se duplicate replies aur task conflicts aayenge.
#
#  State MongoDB (DATABASE_URL) me hai, isliye host badalne pe settings,
#  users, auto-rename aur DDL keys waise ke waise mil jaayenge.
# ============================================================

services:
  bot:
    build:
      context: .
      # MEGA credentials use nahi karte to yeh uncomment karo — build 10-15 min tez:
      # args:
      #   WITH_MEGA: "0"
    image: d2-bot:latest
    container_name: d2-bot

    # Heroku dyno crash pe khud restart kar deta hai; Docker ko bolna padta hai.
    # /restart command ise zaroorat nahi (woh osexec se in-place restart hota hai),
    # par crash/exit ke baad container wapas laane ke liye yeh zaroori hai.
    restart: unless-stopped

    # config.env HOST pe padha jaata hai aur container me env vars ki tarah inject
    # hota hai. Yahi bot ka source of truth hai — yahan `environment:` me PORT ya
    # BASE_URL_PORT override MAT karna, warna config.env ignore ho jaayega.
    env_file:
      - config.env

    ports:
      # Host aur container dono BASE_URL_PORT pe — application isi pe bind karti hai.
      # `:?` guard: BASE_URL_PORT na mile to compose clear error dekar ruk jaata hai
      # (pehle wala 8080:8080 hardcode chup-chaap galat port map kar deta tha).
      - "${BASE_URL_PORT:?BASE_URL_PORT set nahi mila. Chalao: docker compose --env-file config.env up -d --build}:${BASE_URL_PORT}"

    volumes:
      # Heroku pe disk ephemeral tha (~1 GB) — bade tasks wahin atakte the.
      # VPS pe persist karo; container recreate hone pe bhi downloads bache rahenge.
      - ./downloads:/usr/src/app/downloads

    # Beech me download/upload chal raha ho to container turant kill na ho.
    stop_grace_period: 60s

# NOTE: RCLONE_SERVE_PORT (default 8080) alag cheez hai — woh rclone serve ke liye
# hai, D2 web server ke liye nahi. Agar RCLONE_SERVE_URL use karte ho to uska port
# bhi yahan map karna padega. Aria2 RPC (6800) aur qBittorrent WebUI (8090) sirf
# container ke andar use hote hain — inhe expose karne ki zaroorat nahi.
